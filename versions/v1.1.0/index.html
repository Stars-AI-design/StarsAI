<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarsAI Design | AI 角色视觉作品集</title>

  <meta name="theme-color" content="#f8f7f4">
  <meta property="og:title" content="StarsAI Design">
  <meta property="og:description" content="AI artwork, original IP and visual archive.">
  <meta property="og:image" content="assets/concept-link-card.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800;900&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page">
  <header class="home-header" id="top">
    <a class="logo-lockup" href="index.html" aria-label="StarsAI Design 首页">
      <span class="spark-logo" aria-hidden="true"></span>
      <span>StarsAI<br>Design</span>
    </a>

    <button class="nav-toggle ink" type="button" aria-label="打开导航" aria-expanded="false">
      <span></span>
    </button>

    <nav class="home-nav" aria-label="主页导航">
      <a class="is-active" href="#links">主页</a>
      <a href="#ip">原创 IP</a>
      <a href="works.html">作品</a>
    </nav>
  </header>

  <main>
    <section class="home-hero" id="links" aria-labelledby="home-title">
      <div class="shape shape-pink-left"></div>
      <div class="shape shape-pink-top"></div>
      <div class="shape shape-blue"></div>
      <div class="dot-field dots-a"></div>
      <div class="dot-field dots-b"></div>
      <span class="star s1">✦</span>
      <span class="star s2">✦</span>
      <span class="star s3">✦</span>
      <span class="triangle t1"></span>
      <span class="triangle t2"></span>

      <div class="hero-art-card cutout-card reveal">
        <img src="assets/cream-character-cutout.png" alt="狐狐角色透明抠图">
      </div>

      <div class="home-hero-copy reveal">
        <h1 id="home-title">StarsAI</h1>
        <p>AI角色视觉 / 原创IP</p>
        <div class="building-status">作品集</div>
      </div>

      <div class="social-row reveal-group" aria-label="StarsAI Design 发布账号">
        <a class="poster-link card-x" href="https://x.com/StarsAI_design" target="_blank" rel="noreferrer">
          <span class="poster-symbol">X</span>
          <strong>X</strong>
        </a>
        <a class="poster-link card-xhs" href="https://xhslink.com/m/9p7J6KHHOSP" target="_blank" rel="noreferrer">
          <span class="poster-symbol">小红书</span>
          <strong>小红书</strong>
        </a>
        <a class="poster-link card-douyin" href="https://v.douyin.com/XASDJjB7Wbc/" target="_blank" rel="noreferrer">
          <span class="poster-symbol">♪</span>
          <strong>抖音</strong>
        </a>
        <a class="poster-link card-pixiv" href="https://www.pixiv.net/users/115801778" target="_blank" rel="noreferrer">
          <span class="poster-symbol">Px</span>
          <strong>Pixiv</strong>
        </a>
        <a class="poster-link card-afdian" href="https://afdian.com/a/StarsAI" target="_blank" rel="noreferrer">
          <span class="poster-symbol">爱</span>
          <strong>爱发电</strong>
        </a>
        <a class="poster-link card-gallery" href="works.html">
          <span class="poster-symbol">▧</span>
          <strong>Gallery</strong>
        </a>
      </div>
    </section>

    <section class="home-section ip-section" id="ip" aria-labelledby="ip-title">
      <div class="section-title">
        <h2 id="ip-title">原创 IP</h2>
      </div>
      <div class="ip-grid reveal-group">
        <article class="ip-banner fox">
          <div class="ip-copy">
            <h3>狐狐</h3>
            <a href="works.html" class="mini-btn">View <span>→</span></a>
          </div>
          <img src="assets/work-cream-poster.jpg" alt="狐狐风格角色作品">
        </article>
        <article class="ip-banner rabbit">
          <div class="ip-copy">
            <h3>兔兔</h3>
            <a href="works.html" class="mini-btn blue">View <span>→</span></a>
          </div>
          <img src="assets/rabbit-children-day-hero.png" alt="兔兔儿童节角色主视觉">
        </article>
      </div>
    </section>

    <section class="home-section works-preview" aria-labelledby="works-title">
      <div class="section-title with-action">
        <h2 id="works-title">精选作品</h2>
        <a class="view-all" href="works.html">查看全部 <span>→</span></a>
      </div>
      <div class="preview-grid reveal-group">
        <a href="works.html" class="preview-card">
          <img src="assets/hero-haruka.jpg" alt="Haruka Key Visual">
          <span>角色主视觉</span>
        </a>
        <a href="works.html" class="preview-card">
          <img src="assets/work-cream-birthday.jpg" alt="Cream Birthday">
          <span>生日主题海报</span>
        </a>
        <a href="works.html" class="preview-card">
          <img src="assets/work-ai-edit-01.jpg" alt="Generated Log">
          <span>AI 改图档案</span>
        </a>
        <a href="works.html" class="preview-card">
          <img src="assets/work-calendar.jpg" alt="April Calendar">
          <span>四月日历视觉</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="home-footer">
    <strong>StarsAI Design</strong>
    <span>AI 角色视觉、原创 IP 与图像创作档案。v1.1.0</span>
  </footer>

  <script src="motion.js"></script>
